services:
  api:
    build:
      target: build
    command: npm run dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: dev
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
