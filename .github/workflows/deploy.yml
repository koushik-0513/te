name: Build and deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: "063627630243"
  AWS_REGION: ap-southeast-2


  ECS_SUBNETS: subnet-xxxxxxxx,subnet-yyyyyyyy
  ECS_SECURITY_GROUPS: sg-xxxxxxxx

  ECR_REPOSITORY: business-os-api
  ECS_CLUSTER: business-os-cluster
  ECS_SERVICE: business-os-service
  ECS_TASK_FAMILY: business-os-task
  CONTAINER_NAME: business-os-api
  CONTAINER_PORT: "4000"
  EXECUTION_ROLE_NAME: GitHubActionsEcsDeployRole
  LOG_GROUP: /ecs/github-actions-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063627630243:role/GitHubActionsEcsDeployRole
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ---------------------------------------------------------
      # ECR
      # ---------------------------------------------------------

      - name: Create ECR repository if missing
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --region "$AWS_REGION"
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --file Dockerfile \
            --tag "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # ECS cluster
      # ---------------------------------------------------------

      - name: Create ECS cluster if missing
        run: |
          STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' \
            --output text)

          if [ "$STATUS" != "ACTIVE" ]; then
            aws ecs create-cluster \
              --cluster-name "$ECS_CLUSTER"
          fi

      # ---------------------------------------------------------
      # ECS execution role
      # ---------------------------------------------------------

      - name: Create ECS execution role if missing
        run: |
          if ! aws iam get-role \
            --role-name "$EXECUTION_ROLE_NAME" >/dev/null 2>&1; then

            cat > trust-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "ecs-tasks.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF

            aws iam create-role \
              --role-name "$EXECUTION_ROLE_NAME" \
              --assume-role-policy-document file://trust-policy.json

            aws iam attach-role-policy \
              --role-name "$EXECUTION_ROLE_NAME" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

            sleep 10
          fi

          EXECUTION_ROLE_ARN="arn:aws:iam::$AWS_ACCOUNT_ID:role/$EXECUTION_ROLE_NAME"
          echo "EXECUTION_ROLE_ARN=$EXECUTION_ROLE_ARN" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # CloudWatch logs
      # ---------------------------------------------------------

      - name: Create CloudWatch log group if missing
        run: |
          if ! aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP" \
            --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName" \
            --output text | grep -q "$LOG_GROUP"; then

            aws logs create-log-group \
              --log-group-name "$LOG_GROUP"

            aws logs put-retention-policy \
              --log-group-name "$LOG_GROUP" \
              --retention-in-days 14
          fi

      # ---------------------------------------------------------
      # Task definition
      # ---------------------------------------------------------

      - name: Create ECS task definition file
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          cat > task-definition.json <<EOF
          {
            "family": "$ECS_TASK_FAMILY",
            "networkMode": "awsvpc",
            "requiresCompatibilities": [
              "FARGATE"
            ],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "$EXECUTION_ROLE_ARN",
            "containerDefinitions": [
              {
                "name": "$CONTAINER_NAME",
                "image": "$IMAGE_URI",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": $CONTAINER_PORT,
                    "hostPort": $CONTAINER_PORT,
                    "protocol": "tcp"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "$LOG_GROUP",
                    "awslogs-region": "$AWS_REGION",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF

      - name: Register ECS task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Create or update ECS service
      # ---------------------------------------------------------

      - name: Create or update ECS service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].status' \
            --output text)

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            echo "Service exists. Updating it."

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$TASK_DEFINITION_ARN" \
              --force-new-deployment
          else
            echo "Service does not exist. Creating it."

            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --task-definition "$TASK_DEFINITION_ARN" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration \
                "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUPS],assignPublicIp=ENABLED}"
          fi

      - name: Wait for ECS service to become stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"