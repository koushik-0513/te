name: Build and push image to Amazon ECR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: testing
  AWS_ROLE_ARN: arn:aws:iam::063627630243:role/git_pull_push_image_ecr

jobs:
  validate-image:
    name: Validate Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: local/te:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    name: Build and push Docker image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::063627630243:role/git_pull_push_image_ecr
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/testing:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/testing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add image details to the run summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$ECR_REGISTRY/$ECR_REPOSITORY:latest\`" >> "$GITHUB_STEP_SUMMARY"
